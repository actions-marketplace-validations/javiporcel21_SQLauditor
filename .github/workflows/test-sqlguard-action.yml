name: Test SQLGuard Action

on:
  push:
    branches:
      - main
    paths:
      - examples/autofix_smoke.sql
      - .github/workflows/test-sqlguard-action.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run SQLGuard
        uses: javiporcel21/SQLauditor@v1.0.2
        with:
          path: examples/autofix_smoke.sql
          dialect: postgres
          fail_on_high: "true"
          fix: "true"

      - name: Verify SQL was rewritten
        run: |
          grep -Eiq 'status[[:space:]]+IN[[:space:]]*\(' examples/autofix_smoke.sql
          if grep -Eiq 'ORDER[[:space:]]+BY' examples/autofix_smoke.sql; then
            echo "SQLGuard left the redundant ORDER BY in the SQL file."
            exit 1
          fi

      - name: Commit optimized SQL
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/autofix_smoke.sql
          if git diff --cached --quiet; then
            echo "SQLGuard made no changes to commit."
            exit 0
          fi
          git commit -m "Apply SQLGuard autofix [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
