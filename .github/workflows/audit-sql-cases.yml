name: Audit SQL test cases

on:
  push:
    paths:
      - examples/cases/**
      - action.yml
      - src/sqlguard/**
      - pyproject.toml
      - .github/workflows/audit-sql-cases.yml
  pull_request:
    paths:
      - examples/cases/**
      - action.yml
      - src/sqlguard/**
      - pyproject.toml
      - .github/workflows/audit-sql-cases.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-cases:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Copy SQL examples for autofix
        run: cp -R examples/cases "$RUNNER_TEMP/sqlguard-cases"

      - name: Audit SQL examples
        uses: ./
        with:
          path: ${{ runner.temp }}/sqlguard-cases
          dialect: postgres
          fail_on_high: "false"
          fix: "true"
