name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  minimum-supported-dependencies:
    name: Minimum supported dependencies (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.10"

      - name: Install minimum supported dependencies
        run: |
          # Keep these pins aligned with the lower bounds in pyproject.toml.
          python -m pip install \
            "sqlglot==25.0.0" \
            "pydantic==2.7.0" \
            "typer==0.12.0" \
            "rich==13.7.0" \
            "pytest==8.0.0" \
            "ruff==0.6.0" \
            "build==1.2.0"
          python -m pip install --no-deps -e .

      - name: Run tests
        run: pytest -q

      - name: Lint minimum dependency set
        run: ruff check .

      - name: Build with minimum development dependencies
        run: python -m build

  lint-and-build:
    name: Lint and build package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Build source distribution and wheel
        run: python -m build

      - name: Install the built wheel
        run: python -m pip install --no-deps --force-reinstall dist/*.whl

      - name: Check installed command
        run: sqlguard --help

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error
