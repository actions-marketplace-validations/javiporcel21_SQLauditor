name: Test SQLGuard Action

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run SQLGuard
        uses: javiporcel21/SQLauditor@v1.0.2
        with:
          path: examples/autofix_smoke.sql
          dialect: postgres
          fail_on_high: "true"
          fix: "true"

      - name: Verify SQL was rewritten
        run: grep -Fq "status IN ('pending', 'paid')" examples/autofix_smoke.sql
