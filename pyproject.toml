[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlguard"
version = "0.1.0"
description = "Static SQL Optimizer and FinOps Rewriter via AST"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlglot>=25.0.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
sqlguard = "sqlguard.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
