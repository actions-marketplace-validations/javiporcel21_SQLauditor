name: "SQLGuard - Static SQL checks"
description: "Audita archivos SQL de forma estática y aplica autofixes compatibles bajo demanda."
author: "Javier Porcel"
branding:
  icon: "zap"
  color: "green"

inputs:
  path:
    description: "Ruta o carpeta donde buscar archivos .sql"
    required: false
    default: "."
  dialect:
    description: "Dialecto SQL (postgres, bigquery, snowflake, mysql)"
    required: false
    default: "postgres"
  fail_on_high:
    description: "Fallar el workflow si se detectan problemas de severidad HIGH (true/false)"
    required: false
    default: "true"
  fix:
    description: "Sobrescribir los archivos SQL con la versión optimizada (true/false)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: "3.12"

    - name: Install sqlguard
      shell: bash
      env:
        SQLGUARD_ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --force-reinstall "$SQLGUARD_ACTION_PATH"

    - name: Run SQLGuard Audit
      shell: bash
      env:
        SQLGUARD_PATH: ${{ inputs.path }}
        SQLGUARD_DIALECT: ${{ inputs.dialect }}
        SQLGUARD_FAIL_ON_HIGH: ${{ inputs.fail_on_high }}
        SQLGUARD_FIX: ${{ inputs.fix }}
      run: |
        args=(--dialect "$SQLGUARD_DIALECT")
        if [ "$SQLGUARD_FAIL_ON_HIGH" = "true" ]; then
          args+=(--fail-on-high)
        fi
        if [ "$SQLGUARD_FIX" = "true" ]; then
          args+=(--fix)
        fi
        sqlguard "$SQLGUARD_PATH" "${args[@]}"
